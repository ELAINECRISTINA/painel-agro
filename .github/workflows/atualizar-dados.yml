name: Atualizar dados

on:
  schedule:
    - cron: "17 11 * * 1"   # toda segunda-feira, 08:17 (horário de Brasília)
  workflow_dispatch:         # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: ["src/fontes.py", "scripts/atualizar_dados.py"]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Baixar dados do IBGE e do Banco Central
        run: python scripts/atualizar_dados.py

      - name: Salvar snapshot no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Atualiza snapshot de dados"
          git push
